name: Bug report
description: Report incorrect behavior (English, 한국어, 中文, 日本語)
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Actual behavior and expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Inputs, configuration and commands. Replace private data (domains with example.com, IPs with 192.0.2.x).
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release version or commit hash
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, architecture, toolchain versions
